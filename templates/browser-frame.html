<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1600px; height: 900px; background: {{BG_COLOR}}; font-family: -apple-system, "Segoe UI", sans-serif; position: relative; }
  .frame {
    position: absolute; top: 80px; left: 150px; width: 1300px; height: 740px;
    background: #0e131c; border: 2px solid #263041; border-radius: 14px; overflow: hidden;
  }
  .topbar {
    height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 24px;
    border-bottom: 2px solid #263041;
  }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #39424f; }
  .address {
    /* flex:1 tanpa max-width: address bar melebar sampai padding-right topbar (24px),
       persis sama dengan padding-left topbar tempat bullet pertama berada — jarak
       kiri-kanan jadi simetris otomatis lewat flexbox, bukan angka tebakan. */
    flex: 1; height: 28px; margin-left: 16px; border-radius: 14px;
    background: #04060a; border: 1.5px solid #263041; display: flex; align-items: center; padding: 0 14px; gap: 8px;
  }
  .address .lock { width: 8px; height: 8px; border-radius: 50%; background: #3b82f6; flex-shrink: 0; }
  .address .url { color: #8a94a6; font-size: 14px; font-family: ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .content { width: 100%; height: calc(100% - 56px); overflow: hidden; }
  .content img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
</style>
</head>
<body>
  <div class="frame">
    <div class="topbar">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <div class="address"><div class="lock"></div><div class="url">{{URL_LABEL}}</div></div>
    </div>
    <div class="content"><img src="{{SCREENSHOT}}" alt=""></div>
  </div>
</body>
</html>
