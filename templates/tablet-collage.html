<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1600px; height: 900px; background: {{BG_COLOR}}; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .tablet {
    width: 1240px; height: 760px;
    background: #0e131c; border: 2px solid #263041; border-radius: 32px;
    display: flex; align-items: center; justify-content: center; padding: 28px;
    box-shadow: 0 0 0 8px {{BG_COLOR}};
  }
  .screen {
    width: 100%; height: 100%; background: #04060a; border-radius: 12px;
    display: flex; flex-direction: column; padding: 32px;
  }
  .post-header { display: flex; align-items: center; flex-shrink: 0; margin-bottom: 24px; }
  .post-header .username {
    color: #e5e7eb; font-size: 20px; font-weight: 700; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .post-header .username .handle { color: #8a94a6; font-weight: 500; margin-left: 8px; }
  .post-stats { display: flex; gap: 28px; flex-shrink: 0; margin-bottom: 24px; }
  .post-stats .stat { display: flex; align-items: baseline; gap: 6px; }
  .post-stats .stat-num { color: #e5e7eb; font-size: 18px; font-weight: 700; }
  .post-stats .stat-label { color: #8a94a6; font-size: 13px; }
  .post-media {
    flex: 1; border-radius: 16px; position: relative; overflow: hidden;
    background: repeating-linear-gradient(135deg, #131a26 0px, #131a26 16px, #0e131c 16px, #0e131c 32px);
    border: 1.5px solid #263041;
    display: flex; align-items: center; justify-content: center;
  }
  .post-media .play {
    width: 84px; height: 84px; border-radius: 50%; background: #1e3a5f;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 8px rgba(59, 130, 246, 0.12);
  }
  .post-media .play::after {
    content: ''; width: 0; height: 0; margin-left: 6px;
    border-top: 16px solid transparent; border-bottom: 16px solid transparent; border-left: 24px solid #3b82f6;
  }
  .post-caption { padding-top: 24px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
  .post-caption .line { height: 10px; border-radius: 5px; background: #263041; }
  .post-caption .line:nth-child(1) { width: 45%; }
  .post-caption .line:nth-child(2) { width: 28%; }
</style>
</head>
<body>
  <div class="tablet">
    <div class="screen">
      <div class="post-header">
        <div class="username">{{ACCOUNT_NAME}} <span class="handle">({{USERNAME}})</span></div>
      </div>
      <div class="post-stats">
        <div class="stat"><span class="stat-num">128</span><span class="stat-label">Post</span></div>
        <div class="stat"><span class="stat-num">2.4K</span><span class="stat-label">Follower</span></div>
        <div class="stat"><span class="stat-num">180</span><span class="stat-label">Following</span></div>
      </div>
      <div class="post-media"><div class="play"></div></div>
      <div class="post-caption">
        <div class="line"></div>
        <div class="line"></div>
      </div>
    </div>
  </div>
</body>
</html>
